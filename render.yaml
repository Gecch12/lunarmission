services:
  - type: web
    name: perilune
    runtime: node
    plan: free
    buildCommand: npm install --package-lock=false
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
